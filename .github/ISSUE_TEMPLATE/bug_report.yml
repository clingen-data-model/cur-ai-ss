name: Bug report
description: Something looks wrong or does not work in the curation tool
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      description: The address of the page where it happened. The "Report a bug" link in the site footer fills this in.
      placeholder: https://gene-curation-ai.app/papers/…
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did and what you saw. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
