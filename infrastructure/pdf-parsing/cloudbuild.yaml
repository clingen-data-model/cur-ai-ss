# Builds the pdf-parsing service image; see the Dockerfile. Run by
# .github/workflows/pdf-parsing-image.yml, which supplies the substitutions.
steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --build-arg
      - BASE_IMAGE=${_BASE_IMAGE}
      - --tag
      - ${_IMAGE}
      - .
images:
  - ${_IMAGE}
options:
  # Required with a user-specified build service account.
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
timeout: 3600s
